# Docset -> shape for the corpus in models/data/corpus.
#
# Each docset is assigned one of five shapes: form, prose_narrative, hybrid_composite,
# table_dense, complex_layout. Results are broken down by shape.
#
# `basis` records how the assignment was decided:
#   docx_table        assigned in the original shapes table
#   inspected_sample  someone opened documents and looked
#   name_only         a guess from the docset's name; excluded from anything fitted
#
# A docset absent from this file has NO shape: ShapeMap.get() raises UnmappedDocset rather
# than guess, so a new docset must be added here before it can be loaded.
not_a_docset:
- UNASSIGNED
- NO_REF
- Schemas
- field_name_check
docsets:
- docset_id: o9dmulfkp0ii
  display_name: Cruise Itineraries
  org: z4ervk9ic0oo
  shape: complex_layout
  basis: inspected_sample
  note: 'Marketing brochure: multi-column itinerary spreads, pull-quotes, price callouts, day-by-day panels.
    The only complex_layout docset with gold refs.'
