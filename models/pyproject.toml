[project]
name = "dgml-model-compass"
version = "0.1.0"
description = "Model Compass: picking the models for your pipeline. Which models should transcribe and label documents into DGML, by quality, consistency and cost."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
dgc = "model_compass.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "TC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-type-checking]
# pydantic needs field annotations at runtime
runtime-evaluated-base-classes = ["pydantic.BaseModel", "model_compass.corpus.refs.Frozen"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH", "B011"]
"scripts/**" = ["PTH"]
