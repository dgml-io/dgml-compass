# Does the transcriber ranking hold under another labeler? Five transcribers with the
# labeler held at GPT-5.5; includes GPT-5.5 in both roles.
#
# The reference for this spec is the earlier implementation's run 20260930-200000-trgpt55,
# imported scoped to the bundled corpus (scripts/import_mca_run.py). Its Haiku
# transcriber is Haiku 4.5 -- the run predates Haiku 5.5 -- so the arm list keeps it for the
# cell ids to match the reference. The Gemini 3.6 Flash cells were adopted from the
# compass-label-gemini run. In the reference the Opus 5 and Sonnet 5 cells are broken: about
# 45% of the GPT-5.5 labeling calls failed and the trees came back unlabelled.
# compass-transcribe-gpt55-haiku55 is the Haiku 5.5 counterpart.
#
# Known defect 7 (docs/DECISIONS.md): grid rows key the model by label model first, so
# `dgc aggregate` pools the five transcribers into one GPT-5.5 row per shape; compare per
# cell (cells.csv).
#
# Runs over the 9 bundled docsets (data/corpus), 6 documents each, 3 draws.
# Price it first: dgc plan -e specs/compass-transcribe-gpt55.yaml
name: compass-transcribe-gpt55
description: 'Transcriber sweep: generation.model varies, generation.label_model held at GPT-5.5.'
corpus:
  docsets:
    include:
    - z4ervk9ic0oo/8frgx7rlbew3
    - z4ervk9ic0oo/hcqfkilviuq3
    - z4ervk9ic0oo/i0ycfsrfx0av
    - z4ervk9ic0oo/nqkh1hkhhkaf
    - z4ervk9ic0oo/qve3rqreikmn
    - z4ervk9ic0oo/uzruqpzkyugz
    - z4ervk9ic0oo/vg52pfjb0wbf
    - z4ervk9ic0oo/yrrrq1d5kili
    - z4ervk9ic0oo/o9dmulfkp0ii
  max_files_per_docset: 6
  sampling: fixed
  require_gold: false
axes:
  generation.model:
  - anthropic/claude-haiku-4-5
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-5
  - gemini/gemini-3.6-flash
  - openai/gpt-5.5
fixed:
  generation.label_model: openai/gpt-5.5
  schema_tier: none
  window_size: 10
  text_mode: digital
draws: 3
metrics:
- extraction
- reference_free
- economics
- tree
budget_usd: 1200
seed: 20260917
